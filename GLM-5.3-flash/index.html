<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e1c">
<title>2048 NEON SPLASH – ド派手エフェクト版</title>
<style>
/* ==================== テーマ変数(最大タイルで雰囲気が切り替わる) ==================== */
@property --h1 { syntax:'<number>'; inherits:true; initial-value:228; }
@property --h2 { syntax:'<number>'; inherits:true; initial-value:258; }
@property --acc{ syntax:'<number>'; inherits:true; initial-value:196; }

*{ box-sizing:border-box; }
html{ height:100%; }
body{
  margin:0; min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',system-ui,-apple-system,sans-serif;
  color:#eef1ff; overflow:hidden;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  background:
    radial-gradient(130% 100% at 50% -10%, hsl(var(--h1) 55% 12%) 0%, hsl(calc(var(--h1) + 26) 65% 5%) 68%, hsl(calc(var(--h1) + 42) 70% 3%) 100%);
  transition: --h1 1.5s ease, --h2 1.5s ease, --acc 1.5s ease;
}
body[data-tier="0"]{ --h1:228; --h2:258; --acc:196; }
body[data-tier="1"]{ --h1:258; --h2:288; --acc:316; }
body[data-tier="2"]{ --h1:315; --h2:340; --acc:350; }
body[data-tier="3"]{ --h1:348; --h2:24;  --acc:12;  }
body[data-tier="4"]{ --h1:22;  --h2:42;  --acc:32;  }
body[data-tier="5"]{ --h1:42;  --h2:58;  --acc:50;  }
body[data-tier="6"]{ --h1:140; --h2:165; --acc:120; }
body[data-tier="7"]{ --h1:172; --h2:192; --acc:178; }
body[data-tier="8"]{ --h1:198; --h2:220; --acc:205; }
body[data-tier="9"]{ --h1:218; --h2:245; --acc:225; }
body[data-tier="10"]{ --h1:285; --h2:330; --acc:48; }
body[data-tier="11"]{ animation:prism 12s linear infinite; }
@keyframes prism{
  0%  { --h1:265; --h2:325; --acc:195; }
  25% { --h1:140; --h2:190; --acc:110; }
  50% { --h1:25;  --h2:55;  --acc:45;  }
  75% { --h1:345; --h2:300; --acc:280; }
  100%{ --h1:265; --h2:325; --acc:195; }
}

/* ==================== 背景オーロラ ==================== */
#bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob{ position:absolute; width:56vmax; height:56vmax; border-radius:50%;
  mix-blend-mode:screen; filter:blur(70px); opacity:.5;
  background:radial-gradient(closest-side, hsl(var(--h2) 90% 60% / .8), hsl(var(--h2) 90% 60% / 0) 70%);
  transition:opacity 1.5s; }
.b1{ top:-18vmax; left:-14vmax; animation:drift1 26s ease-in-out infinite alternate; }
.b2{ bottom:-20vmax; right:-16vmax; opacity:.45;
  background:radial-gradient(closest-side, hsl(var(--acc) 95% 62% / .75), transparent 70%);
  animation:drift2 31s ease-in-out infinite alternate; }
.b3{ top:36%; left:50%; width:44vmax; height:44vmax; opacity:.32; animation:drift3 38s ease-in-out infinite alternate; }
@keyframes drift1{ to{ transform:translate(13vmax, 9vmax) scale(1.18); } }
@keyframes drift2{ to{ transform:translate(-11vmax, -8vmax) scale(1.22); } }
@keyframes drift3{ to{ transform:translate(-9vmax, 7vmax) scale(.85); } }

/* ==================== ステージ(画面シェイクの対象) ==================== */
#stage{ position:relative; z-index:1; width:min(94vw, 480px);
  display:flex; flex-direction:column; gap:10px; will-change:transform;
  animation:stageIn .7s cubic-bezier(.2,.7,.3,1.2) backwards; }
@keyframes stageIn{ from{ opacity:0; transform:translateY(26px) scale(.96); } }

header{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.title-wrap h1{
  margin:0; font-size:clamp(44px, 13vw, 66px); font-weight:900; font-style:italic;
  letter-spacing:2px; line-height:.95;
  background:linear-gradient(100deg, hsl(var(--acc) 95% 70%), #fff 45%, hsl(var(--h2) 95% 72%) 80%, hsl(var(--acc) 95% 70%));
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:titlePan 7s linear infinite;
  filter:drop-shadow(0 0 18px hsl(var(--acc) 90% 60% / .45));
}
@keyframes titlePan{ to{ background-position:-250% 0; } }
.subtitle{ font-size:11px; letter-spacing:.42em; opacity:.75; margin-top:5px; font-weight:700; text-indent:.42em; }

.scores{ display:flex; gap:8px; }
.scorebox{ min-width:74px; padding:7px 12px 8px; border-radius:14px; text-align:center;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14);
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(8px); }
.scorebox .lbl{ display:block; font-size:10px; letter-spacing:.18em; opacity:.7; font-weight:700; }
.scorebox .val{ font-size:21px; font-weight:900; font-variant-numeric:tabular-nums; }
.scorebox.best.beaten{ border-color:hsl(45 100% 62% / .85);
  box-shadow:0 0 18px hsl(45 100% 60% / .5), inset 0 1px 0 rgba(255,255,255,.12);
  animation:bestPulse 1.2s ease-in-out infinite; }
@keyframes bestPulse{ 50%{ box-shadow:0 0 30px hsl(45 100% 65% / .85), inset 0 1px 0 rgba(255,255,255,.12); } }

.controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.btn{ cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08);
  color:#fff; padding:10px 18px; border-radius:999px; font-weight:800; font-size:14px;
  font-family:inherit; letter-spacing:.06em; backdrop-filter:blur(8px);
  transition:transform .12s, box-shadow .25s, background .25s; }
.btn:hover{ background:rgba(255,255,255,.16); box-shadow:0 0 22px hsl(var(--acc) 90% 60% / .4); }
.btn:active{ transform:scale(.93); }
.btn:focus-visible{ outline:2px solid hsl(var(--acc) 90% 70%); outline-offset:2px; }
.btn.primary{ background:linear-gradient(135deg, hsl(var(--acc) 85% 52%), hsl(var(--h2) 85% 58%));
  border-color:transparent; box-shadow:0 6px 22px hsl(var(--acc) 90% 55% / .45);
  text-shadow:0 1px 4px rgba(0,0,0,.3); }
.icon-btn{ width:42px; height:42px; padding:0; border-radius:50%; font-size:17px; line-height:1;
  display:flex; align-items:center; justify-content:center; }
.icon-btn.off{ opacity:.4; filter:grayscale(.9); }

/* ==================== ボード ==================== */
#board{ position:relative; margin:0 auto; width:100%; aspect-ratio:1/1; border-radius:16px;
  width:clamp(280px, calc(100dvh - 300px), 100%);
  background:linear-gradient(150deg, hsl(var(--h1) 40% 16% / .72), hsl(calc(var(--h1) + 20) 45% 9% / .82));
  border:1px solid hsl(var(--acc) 80% 65% / .38);
  box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 46px hsl(var(--acc) 90% 60% / .16), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  touch-action:none;
  transition:box-shadow 1.5s, border-color 1.5s; }
.cells{ position:absolute; inset:0; display:grid;
  grid-template-columns:repeat(4, var(--cell)); grid-template-rows:repeat(4, var(--cell));
  gap:var(--gap); padding:var(--pad); }
.cell{ background:rgba(255,255,255,.055); border-radius:12%;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.28), inset 0 -1px 0 rgba(255,255,255,.05); }

#tiles{ position:absolute; inset:0; z-index:2; }
#tiles.noanim .tile{ transition:none; }
.tile{ position:absolute; left:0; top:0; will-change:transform;
  transition:transform .13s cubic-bezier(.3,.1,.3,1); }
.tile-inner{ position:relative; width:var(--cell); height:var(--cell); border-radius:12%;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-variant-numeric:tabular-nums; overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,.3); }
.tile-inner.spawn{ animation:spawnIn .2s cubic-bezier(.2,.7,.3,1.3) backwards; }
@keyframes spawnIn{ from{ transform:scale(.3); opacity:0; } }
.tile-inner.pop{ animation:popIn .19s cubic-bezier(.2,.7,.3,1.4) backwards; z-index:3; }
@keyframes popIn{ 0%{ transform:scale(.4); } 60%{ transform:scale(1.18); } 100%{ transform:scale(1); } }

.v2 .tile-inner{ background:linear-gradient(145deg,#f7f9fd,#c9d5ea); color:#465380; }
.v4 .tile-inner{ background:linear-gradient(145deg,#d3e5ff,#8fb8f0); color:#2a4270; }
.v8 .tile-inner{ background:linear-gradient(145deg,#84ddff,#2ea3e8); color:#fff; text-shadow:0 2px 6px rgba(0,40,90,.5); }
.v16 .tile-inner{ background:linear-gradient(145deg,#8df2c1,#28c978); color:#fff; text-shadow:0 2px 6px rgba(0,70,40,.5); }
.v32 .tile-inner{ background:linear-gradient(145deg,#e5f78a,#a3cf1d); color:#fff; text-shadow:0 2px 6px rgba(60,80,0,.55); }
.v64 .tile-inner{ background:linear-gradient(145deg,#ffd97f,#f5a623); color:#fff; text-shadow:0 2px 6px rgba(120,70,0,.55); }
.v128 .tile-inner{ background:linear-gradient(145deg,#ffc482,#ef7d17); color:#fff;
  text-shadow:0 2px 6px rgba(120,50,0,.55);
  box-shadow:0 0 16px 2px rgba(240,130,25,.6), 0 3px 10px rgba(0,0,0,.3); }
.v256 .tile-inner{ background:linear-gradient(145deg,#ff9d8d,#ee3f30); color:#fff;
  text-shadow:0 2px 6px rgba(110,10,0,.55);
  box-shadow:0 0 18px 3px rgba(238,70,50,.65), 0 3px 10px rgba(0,0,0,.3); }
.v512 .tile-inner{ background:linear-gradient(145deg,#ff8fe0,#d42cbc); color:#fff;
  text-shadow:0 2px 6px rgba(90,0,80,.55);
  box-shadow:0 0 20px 4px rgba(215,50,190,.65), 0 3px 10px rgba(0,0,0,.3); }
.v1024 .tile-inner{ background:linear-gradient(145deg,#d19dff,#8b3ee6); color:#fff;
  text-shadow:0 2px 6px rgba(50,0,100,.55);
  box-shadow:0 0 22px 5px rgba(140,60,230,.7), 0 3px 10px rgba(0,0,0,.3); }
.v2048 .tile-inner{ background:linear-gradient(145deg,#fff2b6,#f2b632 55%,#dd8f1f); color:#6b4a00;
  text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:0 0 26px 6px rgba(255,200,60,.8), 0 0 70px 14px rgba(255,160,20,.35);
  animation:goldPulse 1.6s ease-in-out infinite; }
@keyframes goldPulse{ 50%{ box-shadow:0 0 36px 10px rgba(255,210,80,.95), 0 0 90px 22px rgba(255,170,30,.5); } }
.vsuper{ z-index:3; }
.vsuper::before{ content:''; position:absolute; inset:-7px; z-index:-1; border-radius:15%;
  background:conic-gradient(from 0deg,#ff4d6d,#ffb020,#b6ff20,#20e3ff,#7a5cff,#ff4dd8,#ff4d6d);
  filter:blur(12px); opacity:.9; animation:spin 3s linear infinite; }
.vsuper .tile-inner{ background:linear-gradient(145deg,#2b2b45,#0d0d18); color:#fff;
  text-shadow:0 0 12px rgba(255,255,255,.85); }
@keyframes spin{ to{ transform:rotate(1turn); } }
.v512 .tile-inner::after,.v1024 .tile-inner::after,.v2048 .tile-inner::after,.vsuper .tile-inner::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 50%,transparent 68%);
  transform:translateX(-140%) skewX(-12deg);
  animation:sheen 2.6s ease-in-out infinite; }
.v1024 .tile-inner::after{ animation-duration:2s; }
.v2048 .tile-inner::after{ animation-duration:1.4s; }
.vsuper .tile-inner::after{ animation-duration:1.1s; }
@keyframes sheen{ 0%{ transform:translateX(-140%) skewX(-12deg); } 55%,100%{ transform:translateX(240%) skewX(-12deg); } }

/* ==================== スコアポップ ==================== */
#popups{ position:absolute; inset:0; z-index:4; pointer-events:none; }
.popup{ position:absolute; font-weight:900; font-size:22px; color:#fff; white-space:nowrap;
  text-shadow:0 2px 10px rgba(0,0,0,.6), 0 0 14px currentColor; transform:translate(-50%,-50%); }
.popup.big{ font-size:30px; }
.popup.combo{ font-size:26px; letter-spacing:.04em;
  background:linear-gradient(90deg,#ffd76a,#fff,#ffd76a); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 12px rgba(255,200,50,.9)); }
.popup.combo.rainbow{ background:linear-gradient(90deg,#ff5d8f,#ffd76a,#5dff9d,#5db8ff,#d05dff);
  -webkit-background-clip:text; background-clip:text; }

/* ==================== オーバーレイ(勝敗) ==================== */
.overlay{ position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
  border-radius:16px; background:hsl(var(--h1) 50% 8% / .72); backdrop-filter:blur(10px);
  opacity:0; pointer-events:none; transition:opacity .35s; }
.overlay.show{ opacity:1; pointer-events:auto; }
.panel{ text-align:center; padding:26px 30px; margin:0 14px; border-radius:20px;
  background:rgba(10,12,28,.6); border:1px solid hsl(var(--acc) 80% 65% / .4);
  box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 40px hsl(var(--acc) 90% 60% / .25);
  transform:scale(.8); transition:transform .35s cubic-bezier(.2,.7,.3,1.4); }
.overlay.show .panel{ transform:scale(1); }
.panel h2{ margin:0 0 8px; font-size:clamp(26px, 8vw, 36px); font-weight:900;
  background:linear-gradient(100deg, hsl(var(--acc) 95% 72%), #fff 50%, hsl(var(--h2) 95% 74%));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 14px hsl(var(--acc) 90% 60% / .5)); }
.panel p{ margin:0 0 18px; opacity:.85; font-size:14px; line-height:1.8; }
.panel p b{ font-size:20px; color:#ffd76a; }
.btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

footer{ text-align:center; font-size:12px; opacity:.62; line-height:1.8; }

/* ==================== 演出レイヤー ==================== */
#fx{ position:fixed; inset:0; z-index:40; pointer-events:none; }
#flash{ position:fixed; inset:0; z-index:45; pointer-events:none; opacity:0; mix-blend-mode:screen; }
#banner{ position:fixed; top:max(18px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  z-index:60; padding:12px 26px; border-radius:999px; font-weight:900; white-space:nowrap;
  font-size:clamp(14px, 4vw, 19px); letter-spacing:.04em; color:#fff; text-align:center;
  background:linear-gradient(135deg, hsl(var(--h2) 70% 22% / .92), hsl(var(--acc) 70% 18% / .92));
  border:1px solid hsl(var(--acc) 90% 70% / .7);
  box-shadow:0 10px 40px rgba(0,0,0,.5), 0 0 30px hsl(var(--acc) 90% 60% / .5);
  backdrop-filter:blur(10px); opacity:0; pointer-events:none; }

@media (max-width:420px){
  .scorebox{ min-width:64px; padding:6px 9px 7px; }
  .scorebox .val{ font-size:18px; }
  .btn{ padding:9px 14px; font-size:13px; }
}
@media (prefers-reduced-motion: reduce){
  .blob, h1, body[data-tier="11"], .v2048 .tile-inner, .vsuper::before,
  .v512 .tile-inner::after,.v1024 .tile-inner::after,.v2048 .tile-inner::after,.vsuper .tile-inner::after{ animation:none; }
}
</style>
</head>
<body data-tier="0">
  <div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <div id="stage">
    <header>
      <div class="title-wrap">
        <h1>2048</h1>
        <div class="subtitle">NEON SPLASH</div>
      </div>
      <div class="scores">
        <div class="scorebox"><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
        <div class="scorebox best" id="bestBox"><span class="lbl">BEST</span><span class="val" id="best">0</span></div>
        <div class="scorebox"><span class="lbl">MAX</span><span class="val" id="maxv">2</span></div>
      </div>
    </header>

    <div class="controls">
      <button id="newBtn" class="btn primary">新しいゲーム</button>
      <button id="sfxBtn" class="btn icon-btn" aria-label="効果音の切り替え" title="効果音">🔊</button>
      <button id="musicBtn" class="btn icon-btn" aria-label="BGMの切り替え" title="BGM">🎵</button>
    </div>

    <div id="board">
      <div class="cells" id="cells"></div>
      <div id="tiles"></div>
      <div id="popups"></div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <h2 id="ovTitle"></h2>
          <p id="ovText"></p>
          <div class="btns">
            <button id="ovKeep" class="btn primary" style="display:none">続ける</button>
            <button id="ovNew" class="btn">もう一度</button>
          </div>
        </div>
      </div>
    </div>

    <footer>
      矢印キー / WASD / スワイプ でスライド。同じ数字を重ねて 2048 を目指そう！<br>
      🎵 サウンドは最初の操作で有効になります
    </footer>
  </div>

  <canvas id="fx"></canvas>
  <div id="flash"></div>
  <div id="banner"></div>

  <noscript>このゲームにはJavaScriptが必要です。</noscript>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script>
'use strict';
/* ================================================================
   2048 NEON SPLASH — 単一ファイル版
   ================================================================ */

// ---------- ユーティリティ ----------
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FXS = REDUCED ? 0.35 : 1; // エフェクト量の係数

// ---------- 定数 ----------
const N = 4;
const SLIDE_MS = 130;
const VEC = { up:{dr:-1,dc:0}, down:{dr:1,dc:0}, left:{dr:0,dc:-1}, right:{dr:0,dc:1} };
const TIERS = [ // [テーマ名, h1, h2, アクセント] — CSS 側と同じ値
  ['深海',228,258,196], ['紫苑',258,288,316], ['紅梅',315,340,350], ['紅蓮',348,24,12],
  ['灼熱',22,42,32], ['黄金',42,58,50], ['翠嵐',140,165,120], ['碧海',172,192,178],
  ['電光',198,220,205], ['蒼穹',218,245,225], ['虹冠',285,330,48], ['無限',265,325,195]
];
const TILE_FX = { 2:[210,60],4:[214,80],8:[198,90],16:[145,85],32:[78,90],64:[42,100],
  128:[26,100],256:[6,100],512:[318,95],1024:[272,95],2048:[45,100] };
const MERGE_LADDER = ['C4','D4','E4','G4','A4','C5','D5','E5','G5','A5','C6','D6','E6','G6'];
// BGM: Am-F-C-G 4小節ループ
const PROG = [
  { bass:'A1', chord:['A3','C4','E4','A4'] },
  { bass:'F1', chord:['F3','A3','C4','F4'] },
  { bass:'C2', chord:['C4','E4','G4','C5'] },
  { bass:'G1', chord:['G3','B3','D4','G4'] },
];
const BASS_PAT = ['R','R',null,'O','R','R','F','O'];
const ARP = [0,null,1,2,null,3,2,1,0,2,null,1,3,2,1,2];

// ---------- 状態 ----------
let grid, tiles, nextId;
let score = 0, shownScore = 0, best = parseInt(ls.get('f2048.best','0'),10) || 0;
let maxTile = 2, tier = 0;
let won = false, over = false, locked = false, queued = null, moveSeq = 0;
let cell = 0, gap = 0, pad = 0;
let combo = 0, lastMergeAt = 0, beatenShown = false;

// ---------- DOM ----------
const boardEl = $('#board'), tilesLayer = $('#tiles'), popupsEl = $('#popups'),
  scoreEl = $('#score'), bestEl = $('#best'), bestBox = $('#bestBox'), maxEl = $('#maxv'),
  stageEl = $('#stage'), flashEl = $('#flash'), bannerEl = $('#banner'),
  overlayEl = $('#overlay'), ovTitle = $('#ovTitle'), ovText = $('#ovText'),
  ovKeep = $('#ovKeep'), ovNew = $('#ovNew'), fxCanvas = $('#fx'), fxCtx = fxCanvas.getContext('2d');

for(let i = 0; i < N * N; i++){
  const c = document.createElement('div');
  c.className = 'cell';
  $('#cells').appendChild(c);
}

// ---------- レイアウト ----------
function layout(){
  const bw = boardEl.clientWidth;
  pad = Math.round(bw * 0.028);
  gap = Math.max(4, Math.round(bw * 0.026));
  cell = (bw - pad * 2 - gap * (N - 1)) / N;
  boardEl.style.setProperty('--pad', pad + 'px');
  boardEl.style.setProperty('--gap', gap + 'px');
  boardEl.style.setProperty('--cell', cell + 'px');
  tilesLayer.classList.add('noanim');
  for(const t of tiles ? tiles.values() : []) if(t.el){ position(t); sizeFont(t); }
  requestAnimationFrame(() => tilesLayer.classList.remove('noanim'));
}
function cellPos(r, c){ return { x: pad + c * (cell + gap), y: pad + r * (cell + gap) }; }
function cellCenterScreen(r, c){
  const rect = boardEl.getBoundingClientRect(), p = cellPos(r, c);
  return { x: rect.left + p.x + cell / 2, y: rect.top + p.y + cell / 2 };
}
function position(t){
  const p = cellPos(t.r, t.c);
  t.el.style.transform = `translate(${p.x}px, ${p.y}px)`;
}
function sizeFont(t){
  const d = String(t.value).length;
  t.el.style.fontSize = cell * (d <= 2 ? .44 : d === 3 ? .36 : d === 4 ? .3 : .26) + 'px';
}

// ---------- タイル生成 ----------
function makeTileEl(t, kind){
  const el = document.createElement('div');
  el.className = 'tile ' + (t.value <= 4096 ? 'v' + t.value : 'vsuper');
  const inner = document.createElement('div');
  inner.className = 'tile-inner ' + kind;
  inner.textContent = t.value;
  el.appendChild(inner);
  tilesLayer.appendChild(el);
  t.el = el;
  position(t);
  sizeFont(t);
  return el;
}

function initGrid(){
  grid = Array.from({length:N}, () => Array(N).fill(null));
  tiles = new Map();
  nextId = 1;
}

function spawnRandom(){
  const empties = [];
  for(let r = 0; r < N; r++) for(let c = 0; c < N; c++) if(!grid[r][c]) empties.push([r, c]);
  if(!empties.length) return;
  const [r, c] = pick(empties);
  const value = Math.random() < .9 ? 2 : 4;
  const t = { id: nextId++, value, r, c, el:null, merging:false };
  grid[r][c] = t;
  tiles.set(t.id, t);
  makeTileEl(t, 'spawn');
  if(value > maxTile) maxTile = value; // 初期スコア判定用(演出なし)
}

// ---------- 移動・合成 ----------
function traversal(dir){
  const rs = [0,1,2,3], cs = [0,1,2,3];
  if(dir === 'down') rs.reverse();
  if(dir === 'right') cs.reverse();
  const out = [];
  for(const r of rs) for(const c of cs) out.push([r, c]);
  return out;
}
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;

function computeMove(dir){
  const v = VEC[dir];
  for(const t of tiles.values()) t.merging = false;
  const merges = [];
  let moved = false;
  for(const [r, c] of traversal(dir)){
    const t = grid[r][c];
    if(!t) continue;
    let nr = r, nc = c;
    while(inB(nr + v.dr, nc + v.dc) && !grid[nr + v.dr][nc + v.dc]){ nr += v.dr; nc += v.dc; }
    const tr = nr + v.dr, tc = nc + v.dc;
    if(inB(tr, tc)){
      const o = grid[tr][tc];
      if(o.value === t.value && !o.merging){
        // t が o の位置へ滑って合成。合成結果がこの手の中で再合成されないよう merging を立てる
        grid[r][c] = null;
        t.r = tr; t.c = tc;
        const m = { id: nextId++, value: t.value * 2, r: tr, c: tc, from:[t, o], el:null, merging:true };
        grid[tr][tc] = m;
        tiles.set(m.id, m);
        merges.push(m);
        moved = true;
        continue;
      }
    }
    if(nr !== r || nc !== c){
      grid[r][c] = null;
      grid[nr][nc] = t;
      t.r = nr; t.c = nc;
      moved = true;
    }
  }
  return { moved, merges };
}

function movesAvailable(){
  for(let r = 0; r < N; r++) for(let c = 0; c < N; c++){
    const t = grid[r][c];
    if(!t) return true;
    if(c + 1 < N && grid[r][c+1] && grid[r][c+1].value === t.value) return true;
    if(r + 1 < N && grid[r+1][c] && grid[r+1][c].value === t.value) return true;
  }
  return false;
}

function doMove(dir){
  if(over || overlayEl.classList.contains('show')) return;
  if(locked){ queued = dir; return; }
  const { moved, merges } = computeMove(dir);
  if(!moved){ sfx.deny(); wiggle(); return; }
  locked = true;
  sfx.slide();
  for(const t of tiles.values()) if(t.el) position(t);
  const seq = moveSeq;
  setTimeout(() => {
    if(seq !== moveSeq) return;
    finalizeMove(merges);
    spawnRandom();
    if(!movesAvailable()){ gameOver(); }
    locked = false;
    if(queued){ const d = queued; queued = null; doMove(d); }
  }, SLIDE_MS);
}

function finalizeMove(merges){
  if(!merges.length) return;
  let gained = 0, i = 0;
  for(const m of merges){
    for(const f of m.from){ f.el.remove(); tiles.delete(f.id); }
    m.el = makeTileEl(m, 'pop');
    gained += m.value;
    const p = cellCenterScreen(m.r, m.c);
    const bp = cellPos(m.r, m.c);
    fxMerge(p, m.value);
    popup(bp.x + cell / 2, bp.y + cell / 2, '+' + m.value, m.value >= 128 ? 'big' : '', tileFxHues(m.value)[0]);
    sfx.merge(m.value, i++);
    if(m.value > maxTile) setMaxTile(m.value);
    if(m.value === 2048 && !won){ won = true; setTimeout(showWin, 1100); }
  }
  addScore(gained);
  registerCombo(merges.length);
}

// ---------- スコア ----------
let scoreAnim = null;
function addScore(n){
  score += n;
  if(score > best){
    best = score;
    ls.set('f2048.best', String(best));
    if(!beatenShown && best > 0){ beatenShown = true; bestBox.classList.add('beaten'); }
  }
  bestEl.textContent = best;
  rollScore();
}
function rollScore(){
  if(scoreAnim) cancelAnimationFrame(scoreAnim);
  const from = shownScore, to = score, t0 = performance.now(), dur = 280;
  const step = now => {
    const k = clamp((now - t0) / dur, 0, 1);
    shownScore = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    scoreEl.textContent = shownScore;
    scoreAnim = k < 1 ? requestAnimationFrame(step) : null;
  };
  scoreAnim = requestAnimationFrame(step);
}
function registerCombo(n){
  const now = performance.now();
  combo = (now - lastMergeAt < 2500) ? combo + n : n;
  lastMergeAt = now;
  if(combo >= 2){
    const bp = cellPos(0, 0);
    popup(boardEl.clientWidth / 2, 34, 'COMBO ×' + combo, 'combo' + (combo >= 6 ? ' rainbow' : ''), 0, combo);
    shake(Math.min(6, 1.5 + combo * .7));
  }
}

// ---------- ポップアップ ----------
function popup(x, y, text, extra, hue, size){
  const el = document.createElement('div');
  el.className = 'popup ' + (extra || '');
  el.textContent = text;
  if(hue && !(extra || '').includes('combo')) el.style.color = `hsl(${hue} 95% 72%)`;
  if(size) el.style.fontSize = clamp(20 + size * 1.6, 22, 40) + 'px';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  popupsEl.appendChild(el);
  el.animate([
    { opacity: 0, transform: 'translate(-50%,-50%) scale(.6)' },
    { opacity: 1, transform: 'translate(-50%,-58%) scale(1)', offset: .25 },
    { opacity: 1, transform: 'translate(-50%,-110%) scale(1)', offset: .7 },
    { opacity: 0, transform: 'translate(-50%,-150%) scale(.9)' }
  ], { duration: 850, easing: 'ease-out' }).onfinish = () => el.remove();
}

// ---------- テーマ・演出 ----------
function setMaxTile(v){
  maxTile = v;
  const nt = clamp(Math.round(Math.log2(v)) - 1, 0, 11);
  if(nt > tier){
    tier = nt;
    document.body.dataset.tier = tier;
    celebrate(v, tier);
  }
  maxEl.textContent = v;
}
function celebrate(v, t){
  const [name, , h2, acc] = TIERS[t];
  banner(`最大タイル ${v}！テーマ「${name}」解放`);
  flash(`hsl(${acc} 90% 65%)`, clamp(.12 + t * .02, .12, .35));
  confetti(Math.round((70 + t * 25) * FXS));
  burst(cellCenterScreen(1.5, 1.5), { count: Math.round(50 * FXS), hues: [h2, acc, 50], power: 1.6 });
  sfx.fanfare(t >= 10);
}
let bannerAnim = null, bannerTimer = null;
function banner(text){
  bannerEl.textContent = text;
  if(bannerAnim) bannerAnim.cancel();
  clearTimeout(bannerTimer);
  bannerAnim = bannerEl.animate([
    { opacity: 0, transform: 'translateX(-50%) translateY(-26px) scale(.85)' },
    { opacity: 1, transform: 'translateX(-50%) translateY(0) scale(1)', offset: .18 },
    { opacity: 1, transform: 'translateX(-50%) translateY(0) scale(1.03)', offset: .82 },
    { opacity: 0, transform: 'translateX(-50%) translateY(-18px) scale(.95)' }
  ], { duration: 2600, easing: 'ease-out' });
  bannerTimer = setTimeout(() => { bannerAnim && bannerAnim.cancel(); }, 2600);
}
function flash(color, alpha){
  flashEl.style.background = color;
  flashEl.animate([{ opacity: alpha }, { opacity: 0 }], { duration: 520, easing: 'ease-out' });
}
function wiggle(){
  if(REDUCED) return;
  boardEl.animate([
    { transform: 'translateX(0)' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(6px)' },
    { transform: 'translateX(-4px)' }, { transform: 'translateX(0)' }
  ], { duration: 180, easing: 'ease-out' });
}

// ---------- パーティクル&シェイク ----------
const parts = [];
let shakeMag = 0, dpr = 1, lastT = performance.now();

function sizeCanvas(){
  dpr = window.devicePixelRatio || 1;
  fxCanvas.width = Math.round(innerWidth * dpr);
  fxCanvas.height = Math.round(innerHeight * dpr);
}
function tileFxHues(v){
  if(v > 4096){
    const h = (performance.now() / 8) % 360;
    return [h, (h + 120) % 360];
  }
  return TILE_FX[v] || [210, 80];
}
function burst(sc, { count = 20, hues = [45, 200], power = 1, size = 3, grav = 340 } = {}){
  if(parts.length > 420) return;
  for(let i = 0; i < count; i++){
    const a = rand(0, Math.PI * 2), sp = rand(70, 190) * power;
    const l = rand(.45, .9);
    parts.push({
      type: 'spark', x: sc.x + rand(-6, 6), y: sc.y + rand(-6, 6),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(20, 90) * power,
      g: grav, drag: 2.2, life: l, max: l,
      size: rand(1.6, size + 2), hue: Math.random() < .25 ? 0 : pick(hues), white: Math.random() < .2
    });
  }
}
function ring(sc, hue, big){
  parts.push({ type: 'ring', x: sc.x, y: sc.y, r0: cell * (big ? .3 : .22), life: .5, max: .5, hue });
}
function confetti(n){
  const W = innerWidth;
  for(let i = 0; i < n; i++){
    const l = rand(2.2, 3.6);
    parts.push({
      type: 'conf', x: rand(0, W), y: rand(-60, -10),
      vx: rand(-45, 45), vy: rand(60, 150), g: 130, drag: .12,
      life: l, max: l, size: rand(6, 11), rot: rand(0, 6.3), vr: rand(-7, 7),
      hue: Math.random() < .3 ? 48 : rand(0, 360)
    });
  }
}
function fxMerge(sc, v){
  const lv = Math.log2(v);
  const hues = tileFxHues(v);
  burst(sc, { count: Math.round(clamp(8 + lv * 5, 10, 70) * FXS), hues: [hues[0], hues[1], 50], power: .8 + lv * .12, size: 2.5 + lv * .35 });
  if(v >= 64) ring(sc, hues[0], v >= 512);
  if(v >= 256) flash(`hsl(${hues[0]} 90% 65%)`, clamp(.06 + lv * .02, .06, .3));
  shake(1.5 + lv * 1.1);
}
function shake(m){ shakeMag = Math.min(shakeMag + m * FXS, 26); }

function ambientTick(dt){
  const target = Math.min(90, Math.round((26 + tier * 7) * FXS));
  let amb = 0;
  for(const p of parts) if(p.type === 'ambient') amb++;
  if(amb < target && Math.random() < .2){
    const [, , acc] = TIERS[tier];
    const l = rand(4, 9);
    parts.push({
      type: 'ambient', x: rand(0, innerWidth), y: innerHeight + 12,
      vx: rand(-9, 9), vy: rand(-16, -34), g: 0, drag: 0,
      life: l, max: l, size: rand(1, 2.8), hue: Math.random() < .5 ? acc : TIERS[tier][2],
      phase: rand(0, 6.3), sways: rand(.4, 1.2)
    });
  }
  if(tier >= 5 && Math.random() < .0025 * (tier - 4) * FXS){
    const l = .8;
    parts.push({
      type: 'spark', x: rand(innerWidth * .1, innerWidth * .9), y: rand(0, innerHeight * .4),
      vx: rand(240, 420) * (Math.random() < .5 ? -1 : 1), vy: rand(60, 130),
      g: 0, drag: 0, life: l, max: l, size: 2.2, hue: 50, white: true, streak: true
    });
  }
}

function fxLoop(now){
  const dt = Math.min(.033, (now - lastT) / 1000);
  lastT = now;
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxCtx.clearRect(0, 0, innerWidth, innerHeight);
  ambientTick(dt);

  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if(p.life <= 0){ parts.splice(i, 1); continue; }
    const k = p.life / p.max;
    if(p.type === 'ring'){
      const r = p.r0 + (1 - k) * cell * 1.6;
      fxCtx.globalCompositeOperation = 'lighter';
      fxCtx.strokeStyle = `hsla(${p.hue}, 95%, 70%, ${k * .8})`;
      fxCtx.lineWidth = Math.max(1, 6 * k);
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
      fxCtx.stroke();
      continue;
    }
    if(p.type === 'conf'){
      p.vy += p.g * dt;
      p.vx *= Math.exp(-p.drag * dt);
      p.x += p.vx * dt + Math.sin(p.life * 5 + p.rot) * 26 * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      fxCtx.globalCompositeOperation = 'source-over';
      fxCtx.save();
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      fxCtx.fillStyle = `hsla(${p.hue}, 90%, 62%, ${clamp(k * 1.4, 0, 1)})`;
      fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      fxCtx.restore();
      continue;
    }
    // spark / ambient
    p.vy += p.g * dt;
    if(p.drag) { p.vx *= Math.exp(-p.drag * dt); p.vy *= Math.exp(-p.drag * dt); }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if(p.type === 'ambient'){
      p.x += Math.sin(p.life * p.sways + p.phase) * 18 * dt;
      fxCtx.globalCompositeOperation = 'lighter';
      fxCtx.fillStyle = `hsla(${p.hue}, 90%, 70%, ${.16 * Math.sin(Math.PI * k)})`;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size * 2.4, 0, Math.PI * 2);
      fxCtx.fill();
      fxCtx.fillStyle = `hsla(${p.hue}, 90%, 85%, ${.5 * Math.sin(Math.PI * k)})`;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fxCtx.fill();
      continue;
    }
    fxCtx.globalCompositeOperation = 'lighter';
    const col = p.white ? `rgba(255,255,255,${k})` : `hsla(${p.hue}, 95%, 66%, ${k})`;
    if(p.streak || Math.abs(p.vx) > 260){
      fxCtx.strokeStyle = col;
      fxCtx.lineWidth = p.size;
      fxCtx.lineCap = 'round';
      fxCtx.beginPath();
      fxCtx.moveTo(p.x - p.vx * .04, p.y - p.vy * .04);
      fxCtx.lineTo(p.x, p.y);
      fxCtx.stroke();
    } else {
      fxCtx.fillStyle = col;
      fxCtx.beginPath();
      fxCtx.arc(p.x, p.y, p.size * (0.5 + k * .5) * 1.6, 0, Math.PI * 2);
      fxCtx.fill();
    }
  }
  fxCtx.globalCompositeOperation = 'source-over';

  // 画面シェイク
  if(shakeMag > .15){
    const s = REDUCED ? shakeMag * .3 : shakeMag;
    stageEl.style.transform = `translate(${(Math.random() * 2 - 1) * s}px, ${(Math.random() * 2 - 1) * s}px)`;
    shakeMag *= Math.exp(-dt * 7);
  } else if(stageEl.style.transform){
    stageEl.style.transform = '';
    shakeMag = 0;
  }
  requestAnimationFrame(fxLoop);
}

// ---------- サウンド (Tone.js / コード合成) ----------
const S = { tone: typeof Tone !== 'undefined', ready: false, starting: false,
  sfxOn: ls.get('f2048.sfx', '1') === '1', musicOn: ls.get('f2048.music', '1') === '1' };
let musVol, sfxVol, kick, hat, clap, bassSyn, leadSyn, padSyn, popSyn, sparkSyn, fanSyn, whoosh, whooshFil, thud;
let bgmStep = 0;

function ensureAudio(){
  if(!S.tone || S.starting) return;
  S.starting = true;
  Tone.start().then(() => {
    musVol = new Tone.Volume(-13).toDestination();
    sfxVol = new Tone.Volume(-2).toDestination();
    musVol.mute = !S.musicOn;
    sfxVol.mute = !S.sfxOn;

    kick = new Tone.MembraneSynth({ pitchDecay:.04, octaves:6, envelope:{attack:.001, decay:.38, sustain:0} });
    kick.volume.value = -5;
    kick.connect(musVol);

    hat = new Tone.NoiseSynth({ noise:{type:'white'}, envelope:{attack:.001, decay:.035, sustain:0} });
    hat.volume.value = -26;
    hat.connect(musVol);

    clap = new Tone.NoiseSynth({ noise:{type:'pink'}, envelope:{attack:.002, decay:.14, sustain:0} });
    const clapFil = new Tone.Filter({ type:'highpass', frequency:1100 });
    clap.volume.value = -14;
    clap.chain(clapFil, musVol);

    bassSyn = new Tone.Synth({ oscillator:{type:'sawtooth'}, envelope:{attack:.01, decay:.22, sustain:.05, release:.12} });
    const bassFil = new Tone.Filter({ type:'lowpass', frequency:720, Q:1 });
    bassSyn.volume.value = -13;
    bassSyn.chain(bassFil, musVol);

    leadSyn = new Tone.Synth({ oscillator:{type:'square'}, envelope:{attack:.003, decay:.16, sustain:0, release:.08} });
    const delay = new Tone.FeedbackDelay({ delayTime:'8n', feedback:.3, wet:.28 });
    leadSyn.volume.value = -25;
    leadSyn.chain(delay, musVol);

    padSyn = new Tone.PolySynth(Tone.Synth, { oscillator:{type:'triangle'}, envelope:{attack:.02, decay:.3, sustain:.2, release:.6} });
    padSyn.volume.value = -27;
    padSyn.connect(musVol);

    popSyn = new Tone.Synth({ oscillator:{type:'triangle'}, envelope:{attack:.002, decay:.2, sustain:0, release:.1} });
    popSyn.volume.value = -7;
    popSyn.connect(sfxVol);

    sparkSyn = new Tone.MetalSynth();
    sparkSyn.volume.value = -30;
    sparkSyn.connect(sfxVol);

    fanSyn = new Tone.PolySynth(Tone.Synth, { oscillator:{type:'square'}, envelope:{attack:.005, decay:.3, sustain:0, release:.2} });
    fanSyn.volume.value = -15;
    fanSyn.connect(sfxVol);

    whooshFil = new Tone.Filter({ type:'bandpass', frequency:1200, Q:1.2 });
    whoosh = new Tone.NoiseSynth({ noise:{type:'white'}, envelope:{attack:.008, decay:.15, sustain:0} });
    whoosh.volume.value = -20;
    whoosh.chain(whooshFil, sfxVol);

    thud = new Tone.MembraneSynth({ pitchDecay:.008, octaves:4, envelope:{attack:.001, decay:.18, sustain:0} });
    thud.volume.value = -12;
    thud.connect(sfxVol);

    Tone.Transport.bpm.value = 108;
    Tone.Transport.scheduleRepeat(onStep, '16n');
    Tone.Transport.start('+0.05');
    S.ready = true; // 楽器の構築が完了してから解禁
  }).catch(() => { S.starting = false; });
}

function onStep(time){
  if(!S.musicOn){ bgmStep = (bgmStep + 1) % 64; return; }
  Tone.Transport.bpm.value = Math.min(132, 106 + tier * 2.6);
  const st = bgmStep, s16 = st % 16, bar = (st >> 4) & 3;
  const P = PROG[bar];
  const e = 1 + tier; // 進行に応じて賑やかに
  if(s16 % 4 === 0) kick.triggerAttackRelease('C1', '8n', time, .9);
  if(e >= 2 && s16 % 4 === 2) hat.triggerAttackRelease('64n', time, .7);
  if(e >= 5 && s16 % 2 === 1) hat.triggerAttackRelease('64n', time, s16 % 4 === 3 ? .55 : .3);
  if(e >= 3 && (s16 === 4 || s16 === 12)) clap.triggerAttackRelease('16n', time, .8);
  if(e >= 7 && s16 === 15 && Math.random() < .6){
    clap.triggerAttackRelease('64n', time, .5);
    clap.triggerAttackRelease('64n', time + Tone.Time('64n'), .65);
  }
  if(s16 % 2 === 0){
    const b = BASS_PAT[s16 / 2];
    if(b){
      const f = b === 'R' ? P.bass
        : b === 'O' ? Tone.Frequency(P.bass).transpose(12)
        : Tone.Frequency(P.bass).transpose(7);
      bassSyn.triggerAttackRelease(f, '16n', time, .85);
    }
  }
  if(e >= 4){
    const ai = ARP[s16];
    if(ai !== null && Math.random() < .8){
      let n = P.chord[ai % P.chord.length];
      if(e >= 9 && Math.random() < .5) n = Tone.Frequency(n).transpose(12).toNote();
      leadSyn.triggerAttackRelease(n, '32n', time, .5);
    }
  }
  if(e >= 6 && (s16 === 2 || s16 === 10)) padSyn.triggerAttackRelease(P.chord, '8n', time, .3);
  bgmStep = (bgmStep + 1) % 64;
}

const sfxRaw = {
  slide(){
    if(!S.ready || !S.sfxOn) return;
    const t = Tone.now();
    whooshFil.frequency.setValueAtTime(rand(2200, 3000), t);
    whooshFil.frequency.exponentialRampToValueAtTime(420, t + .12);
    whoosh.triggerAttackRelease('16n', t, .35);
  },
  merge(v, i){
    if(!S.ready || !S.sfxOn) return;
    const idx = clamp(Math.round(Math.log2(v)) - 2, 0, MERGE_LADDER.length - 1);
    const t = Tone.now() + i * .035;
    popSyn.triggerAttackRelease(MERGE_LADDER[idx], '16n', t, .75);
    if(v >= 128) sparkSyn.triggerAttackRelease('32n', t, .25 + Math.min(.4, Math.log2(v) / 22));
  },
  deny(){
    if(!S.ready || !S.sfxOn) return;
    thud.triggerAttackRelease('G1', '32n', Tone.now(), .5);
  },
  click(){
    if(!S.ready || !S.sfxOn) return;
    popSyn.triggerAttackRelease('E6', '64n', Tone.now(), .3);
  },
  fanfare(big){
    if(!S.ready || !S.sfxOn) return;
    const t = Tone.now();
    const notes = big ? ['C5','E5','G5','C6','E6','G6'] : ['C5','E5','G5','C6'];
    notes.forEach((n, i) => fanSyn.triggerAttackRelease(n, '16n', t + i * .07, .8));
    if(big) fanSyn.triggerAttackRelease(['E6','G6','C7'], '8n', t + notes.length * .07, .7);
  },
  gameover(){
    if(!S.ready || !S.sfxOn) return;
    const t = Tone.now();
    ['E4','B3','G3','D3'].forEach((n, i) => popSyn.triggerAttackRelease(n, '8n', t + .3 + i * .24, .6));
  }
};
// サウンドの失敗がゲームプレイを壊さないよう包む
const sfx = {};
for(const [name, fn] of Object.entries(sfxRaw)){
  sfx[name] = (...args) => {
    if(!S.ready || !S.sfxOn) return;
    try{ fn(...args); }catch(e){}
  };
}

// ---------- オーバーレイ ----------
let uiPaused = false;
function showOverlay(title, html, keep){
  ovTitle.textContent = title;
  ovText.innerHTML = html;
  ovKeep.style.display = keep ? '' : 'none';
  overlayEl.classList.add('show');
  uiPaused = true;
}
function hideOverlay(){
  overlayEl.classList.remove('show');
  uiPaused = false;
}
function showWin(){
  sfx.fanfare(true);
  flash('hsl(48 100% 70%)', .5);
  confetti(Math.round(220 * FXS));
  banner('🏆 2048 達成！！');
  showOverlay('2048 達成！', `スコア <b>${score}</b><br>この調子でどこまで行ける？`, true);
}
function gameOver(){
  over = true;
  sfx.gameover();
  if(S.ready && S.musicOn) Tone.Transport.pause();
  shake(10);
  setTimeout(() => {
    if(!over) return;
    showOverlay('ゲームオーバー', `スコア <b>${score}</b><br>ベスト <b>${best}</b>`, false);
  }, 650);
}

// ---------- 新規ゲーム ----------
function newGame(){
  moveSeq++;
  hideOverlay();
  over = false; won = false; locked = true; queued = null;
  score = 0; shownScore = 0; scoreEl.textContent = '0';
  combo = 0; beatenShown = false; bestBox.classList.remove('beaten');
  bestEl.textContent = best;
  tier = 0; maxTile = 2;
  document.body.dataset.tier = 0;
  maxEl.textContent = maxTile;
  if(S.ready && S.musicOn && Tone.Transport.state !== 'started') Tone.Transport.start();

  for(const t of tiles.values()){
    if(!t.el) continue;
    const el = t.el, tr = el.style.transform;
    el.animate([
      { opacity: 1, transform: tr + ' scale(1)' },
      { opacity: 0, transform: tr + ' scale(.4)' }
    ], { duration: 170, easing: 'ease-in' }).onfinish = () => el.remove();
  }
  initGrid();
  const seq = moveSeq;
  setTimeout(() => {
    if(seq !== moveSeq) return;
    spawnRandom();
    setTimeout(() => { if(seq === moveSeq){ spawnRandom(); locked = false; } }, 90);
  }, 150);
}

// ---------- 入力 ----------
const KEYMAP = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
  w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right' };
window.addEventListener('keydown', e => {
  const dir = KEYMAP[e.key];
  if(!dir) return;
  e.preventDefault();
  ensureAudio();
  doMove(dir);
});
let swipe = null;
boardEl.addEventListener('pointerdown', e => {
  ensureAudio();
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
window.addEventListener('pointerup', e => {
  if(!swipe || swipe.id !== e.pointerId){ swipe = null; return; }
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  swipe = null;
  if(Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  doMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
boardEl.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

$('#newBtn').addEventListener('click', () => { ensureAudio(); sfx.click(); newGame(); });
ovNew.addEventListener('click', () => { sfx.click(); newGame(); });
ovKeep.addEventListener('click', () => { sfx.click(); hideOverlay(); });

const sfxBtn = $('#sfxBtn'), musicBtn = $('#musicBtn');
function refreshToggles(){
  sfxBtn.textContent = S.sfxOn ? '🔊' : '🔇';
  sfxBtn.classList.toggle('off', !S.sfxOn);
  musicBtn.textContent = S.musicOn ? '🎵' : '🎵̸';
  musicBtn.classList.toggle('off', !S.musicOn);
}
sfxBtn.addEventListener('click', () => {
  ensureAudio();
  S.sfxOn = !S.sfxOn;
  if(sfxVol) sfxVol.mute = !S.sfxOn;
  ls.set('f2048.sfx', S.sfxOn ? '1' : '0');
  refreshToggles();
  if(S.sfxOn) sfx.click();
});
musicBtn.addEventListener('click', () => {
  ensureAudio();
  S.musicOn = !S.musicOn;
  if(musVol) musVol.mute = !S.musicOn;
  if(S.ready && S.musicOn && !over && Tone.Transport.state !== 'started') Tone.Transport.start();
  ls.set('f2048.music', S.musicOn ? '1' : '0');
  refreshToggles();
  sfx.click();
});

document.addEventListener('visibilitychange', () => {
  if(!S.ready) return;
  if(document.hidden) Tone.Transport.pause();
  else if(S.musicOn && !over && Tone.context.state === 'running') Tone.Transport.start();
});

window.addEventListener('resize', () => { sizeCanvas(); layout(); });

// ---------- 開始 ----------
window.__dbg = { // 動作確認用フック
  state: () => ({ score, best, maxTile, tier, tiles: tiles.size, over, won }),
  doMove, newGame,
  forceOver(){ // 埋まって動かせない盤面を再現
    moveSeq++; hideOverlay();
    for(const t of tiles.values()) if(t.el) t.el.remove();
    initGrid();
    locked = false;
    for(let r = 0; r < N; r++) for(let c = 0; c < N; c++){
      const t = { id: nextId++, value: (r + c) % 2 ? 2 : 4, r, c, el:null, merging:false };
      grid[r][c] = t; tiles.set(t.id, t); makeTileEl(t, 'spawn');
    }
    over = false; gameOver();
  },
  forceWin(){ won = false; showWin(); won = true; }
};

initGrid();
sizeCanvas();
layout();
refreshToggles();
bestEl.textContent = best;
spawnRandom();
setTimeout(spawnRandom, 90);
requestAnimationFrame(t => { lastT = t; fxLoop(t); });
</script>
</body>
