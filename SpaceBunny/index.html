<title>SpaceBunny 2048</title>
<style>

.overlay-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.overlay-button{min-height:42px;padding:9px 15px;border:1px solid color-mix(in srgb,var(--accent2) 54%,transparent);border-radius:13px;color:#100d20;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 24%,transparent);font-size:.76rem;font-weight:1000;cursor:pointer}.overlay-button.secondary{color:var(--ink);background:rgba(255,255,255,.07);box-shadow:none}

    requestMove(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');
  });
  app.addEventListener('pointercancel',()=>{pointerStart=null});
  app.addEventListener('lostpointercapture',()=>{pointerStart=null});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopCanvas();sound.suspend()}else{resizeCanvas();restartCanvas();sound.resume();paintSound()}});
  window.addEventListener('pagehide',()=>{sound.suspend();stopCanvas()});
  window.addEventListener('resize',()=>{layout();resizeCanvas()});
  if(window.ResizeObserver)new ResizeObserver(()=>{layout();resizeCanvas()}).observe(board);
  if(reducedQuery){const change=event=>{reducedMotion=event.matches;if(reducedMotion)stopCanvas();seedAmbient();resizeCanvas();restartCanvas()};if(reducedQuery.addEventListener)reducedQuery.addEventListener('change',change);else if(reducedQuery.addListener)reducedQuery.addListener(change)}
  bestEl.textContent=bestScore.toLocaleString('ja-JP');layout();resizeCanvas();restartGame(false);
})();
</script>
