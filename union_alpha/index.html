<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON 2048 - 派手エフェクト版</title>
<style>
:root {
  --bg0: #0a0a12;
  --bg1: #16162a;
  --accent: #00f0ff;
  --accent2: #ff00e0;
  --text: #e8e8ff;
  --tile-size: min(19vmin, 96px);
  --gap: min(2vmin, 10px);
  --board-size: calc(var(--tile-size) * 4 + var(--gap) * 5);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: var(--bg0);
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}

#bgfx {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 20% 10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 55%),
    radial-gradient(ellipse at 80% 90%, color-mix(in srgb, var(--accent2) 14%, transparent), transparent 55%),
    linear-gradient(160deg, var(--bg1), var(--bg0) 70%);
  transition: background 1.2s ease;
}

#bgfx::before {
  content: "";
  position: absolute;
  inset: -50%;
  background:
    repeating-conic-gradient(from 0deg at 50% 50%, color-mix(in srgb, var(--accent) 3%, transparent) 0deg 8deg, transparent 8deg 24deg);
  animation: bgspin 90s linear infinite;
  opacity: 0.6;
}

@keyframes bgspin { to { transform: rotate(360deg); } }

#app {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: min(2.2vmin, 14px);
  padding: min(2vmin, 12px);
}

header {
  width: var(--board-size);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

#title {
  font-size: min(9vmin, 52px);
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1;
  color: var(--text);
  text-shadow:
    0 0 8px color-mix(in srgb, var(--accent) 70%, transparent),
    0 0 30px color-mix(in srgb, var(--accent) 45%, transparent),
    0 0 70px color-mix(in srgb, var(--accent2) 30%, transparent);
  transition: text-shadow 0.8s ease;
}

#subtitle {
  font-size: min(2.6vmin, 13px);
  letter-spacing: 0.42em;
  color: color-mix(in srgb, var(--accent) 80%, white 10%);
  margin-top: 4px;
  text-transform: uppercase;
}

#scores { display: flex; gap: var(--gap); }

.scorebox {
  position: relative;
  min-width: calc(var(--tile-size) * 1.35);
  padding: 6px 14px 8px;
  text-align: center;
  background: color-mix(in srgb, var(--bg1) 72%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  border-radius: 10px;
  backdrop-filter: blur(4px);
  box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 12%, transparent) inset;
}

.score-label {
  font-size: min(2.2vmin, 11px);
  letter-spacing: 0.3em;
  color: color-mix(in srgb, var(--text) 60%, transparent);
}

#score, #best {
  font-size: min(4.4vmin, 26px);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

#score-add {
  position: absolute;
  left: 0; right: 0;
  top: -6px;
  font-size: min(3.6vmin, 20px);
  font-weight: 800;
  color: var(--accent2);
  text-shadow: 0 0 12px var(--accent2);
  opacity: 0;
  pointer-events: none;
}

#score-add.show { animation: scorefly 0.8s ease-out forwards; }

@keyframes scorefly {
  0%   { opacity: 0; transform: translateY(8px) scale(0.8); }
  25%  { opacity: 1; transform: translateY(-4px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-34px) scale(1); }
}


#board-wrap { position: relative; }

#board {
  position: relative;
  width: var(--board-size);
  height: var(--board-size);
  background: color-mix(in srgb, var(--bg1) 80%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 14px;
  box-shadow:
    0 0 40px color-mix(in srgb, var(--accent) 18%, transparent),
    0 20px 60px rgba(0, 0, 0, 0.55);
}

#board.shake-1 { animation: shake1 0.18s ease-in-out; }
#board.shake-2 { animation: shake2 0.22s ease-in-out; }
#board.shake-3 { animation: shake3 0.3s ease-in-out; }

@keyframes shake1 {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(2px, -2px); }
  50% { transform: translate(-2px, 2px); }
  75% { transform: translate(1px, 1px); }
}

@keyframes shake2 {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  20% { transform: translate(4px, -3px) rotate(0.4deg); }
  40% { transform: translate(-4px, 3px) rotate(-0.4deg); }
  60% { transform: translate(3px, 2px) rotate(0.3deg); }
  80% { transform: translate(-2px, -2px) rotate(-0.2deg); }
}

@keyframes shake3 {
  0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
  15% { transform: translate(7px, -5px) rotate(0.8deg) scale(1.012); }
  30% { transform: translate(-7px, 5px) rotate(-0.8deg) scale(1.012); }
  45% { transform: translate(6px, 4px) rotate(0.6deg) scale(1.01); }
  60% { transform: translate(-5px, -4px) rotate(-0.5deg) scale(1.008); }
  80% { transform: translate(3px, 2px) rotate(0.25deg) scale(1.004); }
}

#cells, #tiles, #particles {
  position: absolute;
  inset: 0;
}

#particles { pointer-events: none; overflow: visible; z-index: 5; }

.cell {
  position: absolute;
  width: var(--tile-size);
  height: var(--tile-size);
  border-radius: 10px;
  background: color-mix(in srgb, var(--text) 5%, transparent);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 4%, transparent) inset;
}


.tile {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--tile-size);
  height: var(--tile-size);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  color: #fff;
  background: var(--tc, #555);
  box-shadow:
    0 0 calc(10px + var(--glow, 0) * 22px) color-mix(in srgb, var(--tc) calc(35% + var(--glow, 0) * 65%), transparent),
    0 4px 14px rgba(0, 0, 0, 0.45);
  will-change: transform;
  transition: transform 0.16s cubic-bezier(0.25, 0.9, 0.3, 1.2);
  z-index: 2;
}

.tile .num {
  transform: translateZ(0);
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}

.tile.spawn { animation: spawn 0.24s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }

@keyframes spawn {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.tile.merged { animation: mergepop 0.3s cubic-bezier(0.34, 1.8, 0.5, 1); }

@keyframes mergepop {
  0% { transform: scale(0.4); }
  45% { transform: scale(1.28); }
  100% { transform: scale(1); }
}

.tile.rise { animation: rise 0.5s ease-out; }

@keyframes rise {
  0% { filter: brightness(2.6) saturate(1.6); transform: scale(1.3); }
  100% { filter: brightness(1); transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  #bgfx::before, #board.shake-1, #board.shake-2, #board.shake-3 { animation: none; }
}
footer {
  width: var(--board-size);
  display: flex;
  align-items: center;
  gap: var(--gap);
}

.ctl {
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--bg1) 70%, transparent);
  color: var(--text);
  font-weight: 700;
  font-size: min(2.8vmin, 13px);
  letter-spacing: 0.12em;
  padding: 8px 14px;
  border-radius: 9px;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.ctl:hover { box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 35%, transparent); transform: translateY(-1px); }
.ctl:active { transform: translateY(1px) scale(0.97); }

#hint {
  margin-left: auto;
  font-size: min(2.4vmin, 12px);
  color: color-mix(in srgb, var(--text) 55%, transparent);
  letter-spacing: 0.08em;
}

#overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: color-mix(in srgb, var(--bg0) 72%, transparent);
  backdrop-filter: blur(6px);
  opacity: 1;
  transition: opacity 0.4s ease;
}

#overlay.hidden { opacity: 0; pointer-events: none; }

#overlay-inner { text-align: center; }

#overlay-title {
  font-size: min(8vmin, 44px);
  font-weight: 900;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 60%, transparent));
}

#overlay-sub {
  margin: 10px 0 18px;
  font-size: min(3vmin, 15px);
  color: color-mix(in srgb, var(--text) 80%, transparent);
}

#retry-btn {
  border: none;
  border-radius: 10px;
  padding: 10px 22px;
  font-size: min(3.2vmin, 16px);
  font-weight: 800;
  letter-spacing: 0.1em;
  color: #04101a;
  background: linear-gradient(120deg, var(--accent), var(--accent2));
  cursor: pointer;
  box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 50%, transparent);
  transition: transform 0.12s ease;
}

#retry-btn:hover { transform: scale(1.05); }
#retry-btn:active { transform: scale(0.96); }

.particle {
  position: absolute;
  left: 0;
  top: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
  will-change: transform, opacity;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 3px solid currentcolor;
  pointer-events: none;
  will-change: transform, opacity;
}

.floatscore {
  position: absolute;
  font-weight: 900;
  pointer-events: none;
  will-change: transform, opacity;
  text-shadow: 0 0 10px currentcolor;
}

@media (max-width: 560px) {
  header, footer { width: min(94vw, var(--board-size)); }
  #board { width: min(94vw, var(--board-size)); height: min(94vw, var(--board-size)); }
  #hint { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01s !important; transition-duration: 0.01s !important; }
}
</style>
</head>
<body>
<div id="bgfx"></div>
<div id="app">
  <header>
    <div id="title-wrap">
      <h1 id="title">2048</h1>
      <div id="subtitle">NEON EDITION</div>
    </div>
    <div id="scores">
      <div class="scorebox"><div class="score-label">SCORE</div><div id="score">0</div><div id="score-add"></div></div>
      <div class="scorebox"><div class="score-label">BEST</div><div id="best">0</div></div>
    </div>
  </header>
  <div id="board-wrap">
    <div id="board">
      <div id="cells"></div>
      <div id="tiles"></div>
      <div id="particles"></div>
    </div>
    <div id="overlay" class="hidden">
      <div id="overlay-inner">
        <div id="overlay-title"></div>
        <div id="overlay-sub"></div>
        <button id="retry-btn">もう一度遊ぶ</button>
      </div>
    </div>
  </div>
  <footer>
    <button id="new-btn" class="ctl">NEW GAME</button>
    <button id="sound-btn" class="ctl">SOUND: ON</button>
    <div id="hint">矢印キー / スワイプで操作</div>
  </footer>
</div>
<script>
"use strict";
const SIZE = 4;
const $ = (id) => document.getElementById(id);

const board = $("board");
const tilesEl = $("tiles");
const cellsEl = $("cells");
const particlesEl = $("particles");
const overlay = $("overlay");
const overlayTitle = $("overlay-title");
const overlaySub = $("overlay-sub");
const retryBtn = $("retry-btn");
const newBtn = $("new-btn");
const soundBtn = $("sound-btn");
const scoreEl = $("score");
const bestEl = $("best");
const scoreAdd = $("score-add");

let grid;
let score = 0;
let best = 0;
let maxTile = 0;
let over = false;
let won = false;
let wonShown = false;
let moving = false;
let tileId = 0;
let soundOn = true;

function loadBest() {
  try { best = parseInt(localStorage.getItem("neon2048-best") || "0", 10) || 0; }
  catch (e) { best = 0; }
  bestEl.textContent = best;
}

function saveBest() {
  try { localStorage.setItem("neon2048-best", String(best)); } catch (e) {}
}

function cellPos(r, c) {
  const size = parseFloat(getComputedStyle(cellsEl.firstElementChild || board).width);
  const gap = (board.clientWidth - size * 4) / 5;
  return { x: gap + c * (size + gap), y: gap + r * (size + gap) };
}

function emptyCells() {
  const out = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (!grid[r][c]) out.push({ r, c });
  return out;
}

function addRandomTile() {
  const empties = emptyCells();
  if (!empties.length) return null;
  const pick = empties[Math.floor(Math.random() * empties.length)];
  const value = Math.random() < 0.9 ? 2 : 4;
  const t = { id: ++tileId, r: pick.r, c: pick.c, v: value, el: null };
  grid[pick.r][pick.c] = t;
  return t;
}

function movesAvailable() {
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const t = grid[r][c];
      if (!t) return true;
      if (c + 1 < SIZE) {
        const n = grid[r][c + 1];
        if (!n || n.v === t.v) return true;
      }
      if (r + 1 < SIZE) {
        const n = grid[r + 1][c];
        if (!n || n.v === t.v) return true;
      }
    }
  }
  return false;
}

function makeTileEl(t, spawn) {
  const el = document.createElement("div");
  el.className = "tile" + (spawn ? " spawn" : "");
  const num = document.createElement("div");
  num.className = "num";
  num.textContent = t.v;
  el.appendChild(num);
  applyTileStyle(el, t.v);
  const p = cellPos(t.r, t.c);
  el.style.translate = `${p.x}px ${p.y}px`;
  tilesEl.appendChild(el);
  t.el = el;
  return el;
}

function applyTileStyle(el, v) {
  const theme = THEMES[Math.min(THEMES.length - 1, Math.log2(v) - 1)] || THEMES[0];
  el.style.setProperty("--tc", theme.color);
  const glow = Math.min(1, Math.max(0, (Math.log2(v) - 3) / 7));
  el.style.setProperty("--glow", glow.toFixed(2));
  const len = String(v).length;
  const fs = len >= 5 ? "26%" : len === 4 ? "32%" : len === 3 ? "40%" : "48%";
  el.querySelector(".num").style.fontSize = `calc(var(--tile-size) * ${parseInt(fs, 10)} / 100)`;
}

function moveTile(t, r, c) {
  t.r = r;
  t.c = c;
  const p = cellPos(r, c);
  requestAnimationFrame(() => {
    if (t.el) t.el.style.translate = `${p.x}px ${p.y}px`;
  });
}

function buildCells() {
  cellsEl.innerHTML = "";
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cellsEl.appendChild(cell);
      const p = cellPos(r, c);
      cell.style.transform = `translate(${p.x}px, ${p.y}px)`;
    }
  }
}

function newGame() {
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  tilesEl.innerHTML = "";
  particlesEl.innerHTML = "";
  score = 0;
  maxTile = 0;
  over = false;
  won = false;
  wonShown = false;
  scoreEl.textContent = "0";
  overlay.classList.add("hidden");
  buildCells();
  addRandomTile();
  addRandomTile();
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (grid[r][c]) makeTileEl(grid[r][c], true);
  updateTheme();
}

function slideLine(line) {
  const vals = line.filter(Boolean).map(({ merged, dead, ...tile }) => tile);
  const out = [];
  const gained = [];
  let i = 0;
  while (i < vals.length) {
    if (i + 1 < vals.length && vals[i].v === vals[i + 1].v) {
      const merged = { ...vals[i], v: vals[i].v * 2, merged: true };
      gained.push(vals[i].v * 2);
      out.push(merged);
      merged.dead = vals[i + 1];
      i += 2;
    } else {
      out.push(vals[i]);
      i += 1;
    }
  }
  while (out.length < SIZE) out.push(null);
  return { out, gained };
}

const THEMES = [
  { color: "#187992", name: "ION", hue: 185 },
  { color: "#2955b0", name: "VOLT", hue: 215 },
  { color: "#7541bc", name: "PULSE", hue: 265 },
  { color: "#b32983", name: "BLOOM", hue: 310 },
  { color: "#c33c58", name: "FLARE", hue: 345 },
  { color: "#ca6126", name: "IGNITION", hue: 25 },
  { color: "#aa8114", name: "SOLAR", hue: 45 },
  { color: "#418e38", name: "AURORA", hue: 110 },
  { color: "#138876", name: "HYPER", hue: 165 },
  { color: "#5161d9", name: "NOVA", hue: 235 },
  { color: "#b649c6", name: "SUPERNOVA", hue: 285 }
];

function updateTheme() {
  const next = Math.max(2, ...grid.flat().filter(Boolean).map(t => t.v));
  if (next <= maxTile) return false;
  maxTile = next;
  const level = Math.log2(next) - 1;
  const theme = THEMES[level % THEMES.length];
  const root = document.documentElement.style;
  root.setProperty("--accent", `hsl(${theme.hue} 100% 68%)`);
  root.setProperty("--accent2", `hsl(${theme.hue + 75} 100% 68%)`);
  root.setProperty("--bg1", `hsl(${theme.hue} 48% 13%)`);
  root.setProperty("--energy", Math.min(1, 0.18 + level * 0.08));
  $("subtitle").textContent = theme.name + " / " + next;
  return true;
}

function extractLines(dir) {
  const lines = [];
  for (let i = 0; i < SIZE; i++) {
    const line = [];
    for (let j = 0; j < SIZE; j++) {
      let r, c;
      if (dir === "left") { r = i; c = j; }
      else if (dir === "right") { r = i; c = SIZE - 1 - j; }
      else if (dir === "up") { r = j; c = i; }
      else { r = SIZE - 1 - j; c = i; }
      line.push(grid[r][c]);
    }
    lines.push(line);
  }
  return lines;
}

function writeBack(lines, dir) {
  for (let i = 0; i < SIZE; i++) {
    for (let j = 0; j < SIZE; j++) {
      let r, c;
      if (dir === "left") { r = i; c = j; }
      else if (dir === "right") { r = i; c = SIZE - 1 - j; }
      else if (dir === "up") { r = j; c = i; }
      else { r = SIZE - 1 - j; c = i; }
      grid[r][c] = lines[i][j];
    }
  }
}

function doMove(dir) {
  if (moving || over || !overlay.classList.contains("hidden")) return;
  const lines = extractLines(dir);
  const moved = [];
  const merges = [];
  let gained = 0;

  for (let i = 0; i < SIZE; i++) {
    const { out, gained: g } = slideLine(lines[i]);
    gained += g.reduce((a, b) => a + b, 0);
    for (let j = 0; j < SIZE; j++) {
      const t = out[j];
      const orig = lines[i][j];
      if (t && t !== orig) moved.push({ t, r: i, c: j });
    }
    lines[i] = out;
  }
  writeBack(lines, dir);

  if (!moved.length && !merges.length) {
    if (!movesAvailable()) endGame();
    return;
  }

  moving = true;
  for (const { t, r, c } of moved) {
    if (t.merged) {
      const dead = t.dead;
      if (dead && dead.el) {
        const deadEl = dead.el;
        moveTile(dead, r, c);
        setTimeout(() => { deadEl.remove(); }, 130);
        dead.el = null;
      }
      t.merged = false;
      moveTile(t, r, c);
      setTimeout(() => {
        if (t.el) {
          t.el.classList.add("merged");
          applyTileStyle(t.el, t.v);
          t.el.querySelector(".num").textContent = t.v;
        }
      }, 100);
      merges.push({ t, r, c });
    } else {
      moveTile(t, r, c);
    }
  }

  if (gained > 0) {
    score += gained;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
    scoreAdd.textContent = "+" + gained;
    scoreAdd.classList.remove("show");
    void scoreAdd.offsetWidth;
    scoreAdd.classList.add("show");
  }

  const spawnT = addRandomTile();
  if (spawnT) makeTileEl(spawnT, true);

  const mergedCount = merges.length;
  if (mergedCount > 0) {
    const mid = merges.reduce((a, m) => Math.max(a, m.t.v), 0);
    shake(Math.min(3, 1 + Math.floor(Math.log2(mid) / 3)));
    burst(merges);
    playMerge(Math.log2(mid));
  } else {
    playSlide();
  }

  const rose = updateTheme();
  if (rose) {
    playRise();
    for (const row of grid) for (const t of row) {
      if (t && t.v === maxTile && t.el) {
        t.el.classList.remove("rise");
        void t.el.offsetWidth;
        t.el.classList.add("rise");
      }
    }
  }

  setTimeout(() => {
    moving = false;
    if (!movesAvailable()) {
      over = true;
      overlayTitle.textContent = "ゲームオーバー";
      overlaySub.textContent = "スコア " + score;
      overlay.classList.remove("hidden");
      playOver();
    }
  }, 170);
}

function shake(level) {
  board.classList.remove("shake-1", "shake-2", "shake-3");
  void board.offsetWidth;
  board.classList.add("shake-" + level);
}

function burst(merges) {
  for (const m of merges) {
    const p = cellPos(m.r, m.c);
    const cx = p.x + 40, cy = p.y + 40;
    const color = getComputedStyle(document.documentElement)
      .getPropertyValue("--accent2").trim() || "#ff00e0";
    const n = 10 + Math.min(14, Math.log2(m.t.v) * 2);
    for (let k = 0; k < n; k++) {
      const dot = document.createElement("div");
      dot.className = "particle";
      const ang = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 60;
      dot.style.background = color;
      dot.style.transform = `translate(${cx}px, ${cy}px)`;
      dot.style.opacity = "1";
      particlesEl.appendChild(dot);
      dot.animate([
        { transform: `translate(${cx}px, ${cy}px) scale(1)`, opacity: 1 },
        { transform: `translate(${cx + Math.cos(ang) * dist}px, ${cy + Math.sin(ang) * dist}px) scale(0)`, opacity: 0 }
      ], { duration: 420 + Math.random() * 260, easing: "cubic-bezier(0.2,0.6,0.3,1)" })
        .onfinish = () => dot.remove();
    }
    const ring = document.createElement("div");
    ring.className = "ring";
    ring.style.color = color;
    ring.style.width = "80px";
    ring.style.height = "80px";
    ring.style.opacity = "0.8";
    ring.style.transform = `translate(${cx - 40}px, ${cy - 40}px) scale(0.4)`;
    particlesEl.appendChild(ring);
    ring.animate([
      { transform: `translate(${cx - 40}px, ${cy - 40}px) scale(0.4)`, opacity: 0.9 },
      { transform: `translate(${cx - 60}px, ${cy - 60}px) scale(1.5)`, opacity: 0 }
    ], { duration: 500, easing: "ease-out" }).onfinish = () => ring.remove();
  }
}

function endGame() {
  over = true;
}

let actx = null;
let master = null;
let bgmTimer = null;
let bgmStep = 0;

function audio() {
  if (!soundOn) return null;
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.5;
    master.connect(actx.destination);
    startBGM();
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}

function tone(freq, dur, type, vol, when, slide) {
  const ctx = audio();
  if (!ctx) return;
  const t0 = ctx.currentTime + (when || 0);
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.2, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g).connect(master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function playSlide() {
  tone(220, 0.1, "triangle", 0.1, 0, 330);
}

function playMerge(power) {
  const base = 320 + power * 40;
  tone(base, 0.12, "square", 0.14, 0);
  tone(base * 1.5, 0.16, "sine", 0.16, 0.03);
  if (power >= 6) tone(base * 2, 0.2, "sawtooth", 0.1, 0.05);
}

function playRise() {
  [440, 554, 659, 880].forEach((f, i) => tone(f, 0.3, "sine", 0.18, i * 0.09));
}

function playOver() {
  [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, "triangle", 0.16, i * 0.18));
}

const BGM_SCALE = [0, 3, 5, 7, 10, 12, 15, 12, 10, 7, 5, 3];
const BGM_ROOT = 220;

function startBGM() {
  stopBGM();
  bgmStep = 0;
  bgmTimer = setInterval(() => {
    if (!soundOn || document.hidden) return;
    const semi = BGM_SCALE[bgmStep % BGM_SCALE.length];
    const f = BGM_ROOT * Math.pow(2, semi / 12);
    tone(f, 0.22, "sine", 0.045, 0);
    if (bgmStep % 4 === 0) tone(f / 2, 0.3, "triangle", 0.05, 0);
    if (Math.log2(maxTile) >= 6 && bgmStep % 2 === 1) tone(f * 2, 0.12, "square", 0.02, 0);
    bgmStep++;
  }, 320);
}

function stopBGM() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.textContent = "SOUND: " + (soundOn ? "ON" : "OFF");
  if (soundOn) { audio(); } else if (actx) { actx.suspend(); }
});

function retry() {
  newGame();
}

retryBtn.addEventListener("click", retry);
newBtn.addEventListener("click", retry);

window.addEventListener("keydown", (e) => {
  const dirs = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down"
  };
  const dir = dirs[e.key];
  if (dir) {
    e.preventDefault();
    doMove(dir);
  }
});

let touchStart = null;

window.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: true });

window.addEventListener("touchend", (e) => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    doMove(dx > 0 ? "right" : "left");
  } else {
    doMove(dy > 0 ? "down" : "up");
  }
}, { passive: true });

loadBest();
newGame();
</script>
